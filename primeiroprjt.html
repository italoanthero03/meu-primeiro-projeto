<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Projeto</title>
    <link rel="icon" type="image/x-icon" href="https://br.linkedin.com/school/senaibahia/.ico">
</head>
<body>
    <div class="cabecalho">
        <h1>Cadastro do Aluno</h1>
        <h2>primeiro projeto com Git!</h2>
        
        </div>
    <form>
        <div class="formularios">
            <hr>
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite o seu nome" required>
            
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="exemplo@gmail.com" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            
            <label for="datanascimento">Data de nascimento:</label>
            <input type="date" id="datanascimento" name="datanascimento" required>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 99999-9999" required>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>

            <label for="genero">Qual o seu gênero?</label>
            <select id="genero" name="genero" >
                <option>Masculino</option>
                <option>Feminino</option>
                <option>Prefiro não responder</option>
            </select>

            <label for="curso">Qual curso você deseja?</label>
            <select id="curso" name="curso">
                <option>Desenvolvimento de sistemas</option>
                <option>Informática</option>
                <option>Matemática</option>
                <option>Logistica</option>
            </select>

            <button type="submit" class="button-cadastro" onclick="alert('Cadastro finalizado')">Finalizar</button>
            <button type="reset" class="button-limpar">Limpar formulários</button>
            <hr>
        </div>
    </form>
    
    <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/0/05/SENAI_logo_2024.png?utm_source=pt.wikipedia.org&utm_campaign=index&utm_content=original" alt="logo do SENAI">
    <a class="button-senai" href="https://www.firjan.com.br/senai/" target="_blank">ACESSAR SENAI</a>
    <hr>
    <footer class="rodape">Italo GitHub primeiro projeto :)</footer>
